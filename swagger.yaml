openapi: 3.0.0

info:
  title: Jobs API
  version: 1.0.0
  description: API documentation for authentication and jobs endpoints

servers:
  - url: https://temp-jobs-api-g3f1.onrender.com/api/v1

paths:
  /auth/register:
    post:
      summary: Register User
      operationId: registerUser
      tags:
        - Auth
      requestBody:
        $ref: '#/components/requestBodies/register_user'
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Bad request

  /auth/login:
    post:
      summary: Login User
      operationId: loginUser
      tags:
        - Auth
      requestBody:
        $ref: '#/components/requestBodies/login_user'
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /jobs:
    post:
      summary: Create Job
      operationId: createJob
      tags:
        - Jobs
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/create_job'
      responses:
        '201':
          description: Job created successfully
        '401':
          description: Unauthorized

    get:
      summary: Get All Jobs
      operationId: getAllJobs
      tags:
        - Jobs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of jobs retrieved successfully
        '401':
          description: Unauthorized

  /jobs/{id}:
    get:
      summary: Get Single Job
      operationId: getSingleJob
      tags:
        - Jobs
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: string
      responses:
        '200':
          description: Job retrieved successfully
        '404':
          description: Job not found

    patch:
      summary: Update Job
      operationId: updateJob
      tags:
        - Jobs
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/update_job'
      responses:
        '200':
          description: Job updated successfully
        '401':
          description: Unauthorized
        '404':
          description: Job not found

    delete:
      summary: Delete Job
      operationId: deleteJob
      tags:
        - Jobs
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Job ID
          schema:
            type: string
      responses:
        '200':
          description: Job deleted successfully
        '401':
          description: Unauthorized
        '404':
          description: Job not found

components:
  schemas:
    register_user:
      type: object
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          example: Shina
        email:
          type: string
          example: shina@gmail.com
        password:
          type: string
          example: shina1234

    login_user:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          example: sam1@gmail.com
        password:
          type: string
          example: sam1234

    create_job:
      type: object
      required:
        - company
        - position
      properties:
        company:
          type: string
          example: ASA
        position:
          type: string
          example: Developer

    update_job:
      type: object
      properties:
        company:
          type: string
          example: Supabase
        position:
          type: string
          example: Backend Developer

  requestBodies:
    register_user:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/register_user'

    login_user:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/login_user'

    create_job:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/create_job'

    update_job:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/update_job'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT